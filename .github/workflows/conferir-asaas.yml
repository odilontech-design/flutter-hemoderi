name: Conferir cobranças do Asaas

# Pergunta ao Asaas como estão as cobranças de cartão em aberto e acerta o que o
# webhook não trouxe. Requer o secret CRON_SECRET (o mesmo valor da Vercel).
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a rotina
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 60 -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://app.hemoderi.com.br/api/rotinas/asaas"
